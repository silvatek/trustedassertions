{{define "content"}}		
        <h2>Login</h2>

        <div class="error">{{.Detail}}</div>

        <form method="POST" action="/web/login" hx-boost="false">
                {{.CsrfField}}
                <div>
                    <label for="user_id">ID:</label><br>
                    <input id="user_id" name="user_id" autofocus>
                </div>
                <div>
                    <label for="password">Password:</label><br>
                    <input id="password" name="password" type="password">
                </div>
                <div>
                        <input id="login" type="Submit" value="Login">
                </div>
        </form>
        <div>
            <button type="button" id="use-passkey" hx-boost="false" onclick="window.taPasskeys && taPasskeys.login()">Use a passkey</button>
        </div>
        <p id="passkey-status" class="error"></p>
        <script src="/web/static/passkey.js"></script>
{{end}}
