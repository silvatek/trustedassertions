<!doctype html>
<html lang=en>
<head>
    <meta charset=utf-8>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Trusted Assertions framework">
    <meta name=”robots” content=”noindex”>
    <title>Trusted Assertions</title>
    <link rel="stylesheet" href="/web/static/default.css">
    <link href="/web/static/TickSpeech.svg" rel="icon" type="image/svg" />
    <script src="/web/static/htmx.min.js"></script>
</head>

<body>
    <div class="header">
        <div class="pagelogo">
            <a href="/web/home" aria-label="Return to home page" id="pagelogo">
                <img src="/web/static/TickSpeech.svg" alt="Site logo, reload home page" height="32px">
            </a>
        </div>
        <h1 class="pageheading">Trusted Assertions (htmx)</h1>
    </div>
    <div id="pagemenu">
        <hr>
        <nav class="pagemenu">
            <span class="leftlink">
                {{range $item := .LeftMenu.Items}}
                    <span>
                        {{$item.Separator}}
                        {{if $item.IsLink}}
                            <a hx-get="{{$item.Target}}" hx-select-oob="#content" hx-push-url="true">{{$item.Text}}</a>
                        {{else}}
                            {{$item.Text}}
                        {{end}}                    
                    </span>
                {{end}}            
            </span>
            <span class="rightlink">
                {{range $item := .RightMenu.Items}}
                    <span>
                        {{$item.Separator}}
                        {{if $item.IsLink}}
                            <a hx-get="{{$item.Target}}" hx-select-oob="#content" hx-push-url="true">{{$item.Text}}</a>
                        {{else}}
                            {{$item.Text}}
                        {{end}}                    
                    </span>
                {{end}}            
            </span>
        </nav>
        <hr>
    </div>
    <div id="content" hx-trigger="load" hx-get="/web/{{.ContentFragment}}" hx-select-oob="#content">
    </div>
    <div class="footer">
        &nbsp;
    </div>
</body>
</html>
